<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password — PlacementPro</title>
<link rel="stylesheet" href="css/main.css"/>
<link rel="stylesheet" href="css/components.css"/>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;background:var(--bg-dark);">
<div style="position:absolute;inset:0;background:var(--bg-dark);z-index:-2;"></div>
<div style="width:100%;max-width:440px;animation:fadeIn .6s ease both;">
  <!-- Logo -->
  <div style="text-align:center;margin-bottom:2rem;">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:.75rem;text-decoration:none;">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--text-primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;color:var(--bg-dark);font-family:var(--font-display);">P</div>
      <span style="font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--text-primary);">PlacementPro</span>
    </a>
  </div>

  <div class="card" style="padding:2.5rem;background:var(--bg-card);">
    <h1 style="font-size:1.6rem;text-align:center;margin-bottom:.5rem;">Reset Password 🔒</h1>
    <p style="color:var(--text-secondary);text-align:center;font-size:.9rem;margin-bottom:2rem;">We'll send you a link to reset your password</p>

    <div id="forgot-success" style="display:none;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--success);padding:1rem;border-radius:8px;font-size:0.875rem;margin-bottom:1.5rem;text-align:center;">
    </div>

    <form id="forgot-form" style="display:flex;flex-direction:column;gap:1.25rem;">
      <div class="form-group">
        <label class="form-label" for="forgot-email">Email Address</label>
        <div class="form-input-icon">
          <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
          <input type="email" id="forgot-email" class="form-input" placeholder="you@college.edu" autocomplete="email"/>
        </div>
      </div>
      
      <p id="forgot-error" style="color:var(--danger);font-size:.825rem;margin:0;min-height:1.2em;"></p>
      <button type="submit" id="forgot-btn" class="btn btn-primary w-full" style="justify-content:center;font-size:1rem;padding:13px;width:100%;">Send Reset Link</button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;color:var(--text-secondary);font-size:.875rem;">
      Remember your password? <a href="login.html" style="color:var(--primary-light);font-weight:600;">Back to sign in</a>
    </p>
  </div>
</div>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
