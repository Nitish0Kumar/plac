<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — PlacementPro</title>
    
    <!-- Theme boot: apply before paint to prevent flash -->
    <script>
        (function(){
            const t = localStorage.getItem('pp_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'light') document.documentElement.classList.add('light');
        })();
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        'primary-hover': 'var(--primary-hover)',
                        accent: 'var(--accent)',
                        dark: 'var(--bg-dark)',
                        card: 'var(--bg-card)',
                        elevated: 'var(--bg-elevated)',
                        border: 'var(--border)',
                        'border-hover': 'var(--border-hover)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    }
                }
            },
            safelist: [
                'bg-blue-500',
                'text-blue-500',
                'border-blue-500',
                'bg-emerald-500',
                'text-emerald-500',
                'border-emerald-500',
                'bg-purple-500',
                'text-purple-500',
                'bg-red-500',
                'text-red-500',
                'bg-orange-500',
                'text-orange-500',
                'bg-success',
                'text-success',
                'border-success'
            ]
        }
    </script>
</head>
<body class="bg-dark text-slate-200 overflow-hidden">

    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-card border-r border-border z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col shadow-lg">
        <!-- Sidebar Header -->
        <div class="h-16 flex items-center justify-between px-4 border-b border-border shrink-0">
            <a href="index.html" class="flex items-center gap-2 text-text-primary decoration-none hover:opacity-80 transition-opacity">
                <div class="w-8 h-8 rounded-lg bg-text-primary flex items-center justify-center font-heading font-bold text-lg text-dark shadow-sm">P</div>
                <span class="font-heading font-bold text-lg text-text-primary">PlacementPro</span>
            </a>
            <button id="close-sidebar" class="text-text-muted hover:text-text-primary lg:hidden">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Navigation Menu -->
        <div class="flex-1 overflow-y-auto custom-scrollbar py-4 px-3" id="nav-menu">
            <!-- Populated by app.js -->
        </div>
        
        <!-- Sidebar Footer / User Profile -->
        <div class="p-4 border-t border-border shrink-0">
            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-elevated cursor-pointer transition-colors border border-transparent hover:border-border-hover">
                <div class="w-10 h-10 rounded-full bg-elevated flex items-center justify-center font-bold text-text-primary border-2 border-border">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User Avatar" class="w-full h-full rounded-full">
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-text-primary truncate" id="user-name">Loading...</p>
                    <p class="text-xs text-text-muted truncate" id="user-role">Student</p>
                </div>
                <button onclick="navigateTo('logout')" title="Logout" class="text-text-muted hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="lg:ml-64 flex flex-col h-screen transition-all duration-300">
        <!-- Top Navigation -->
        <header class="h-16 bg-card/80 backdrop-blur-md border-b border-border flex items-center justify-between px-4 lg:px-8 z-30 sticky top-0 shrink-0">
            <div class="flex items-center gap-4">
                <button id="open-sidebar" class="text-text-muted hover:text-text-primary lg:hidden">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 id="page-title" class="font-heading font-semibold text-lg text-text-primary hidden sm:block">Dashboard</h2>
            </div>
            
            <div class="flex items-center gap-3 sm:gap-4">
                <!-- Search (wrapped in relative for dropdown) -->
                <div class="relative hidden md:flex items-center bg-elevated border border-border rounded-full px-3 py-1.5 focus-within:border-border-hover focus-within:shadow-sm transition-all w-52">
                    <i class="fa-solid fa-search text-text-muted text-sm flex-shrink-0"></i>
                    <input type="text" placeholder="Search... (⌘K)" class="bg-transparent border-none outline-none text-sm text-text-primary px-2 w-full placeholder-text-muted">
                </div>
                
                <!-- Quick Actions -->
                <button id="notif-btn" class="w-9 h-9 rounded-full bg-elevated hover:bg-border border border-border flex items-center justify-center text-text-secondary hover:text-text-primary transition-all relative hover:scale-105" data-tooltip="Notifications">
                    <i class="fa-regular fa-bell text-sm"></i>
                    <span class="absolute top-0.5 right-0.5 w-2 h-2 bg-red-500 rounded-full border-2 border-card animate-pulse"></span>
                </button>
                <!-- Theme Toggle -->
                <button id="theme-toggle" onclick="window.toggleTheme()" class="w-9 h-9 rounded-full bg-elevated hover:bg-border border border-border flex items-center justify-center text-text-secondary hover:text-text-primary transition-all hover:scale-105" data-tooltip="Toggle Theme">
                    <i class="fa-solid fa-sun sun text-sm text-amber-400"></i>
                    <i class="fa-solid fa-moon moon text-sm text-indigo-400"></i>
                </button>
                <button onclick="navigateTo('tasks')" class="w-9 h-9 rounded-full bg-elevated hover:bg-border border border-border flex items-center justify-center text-text-primary transition-all hidden sm:flex hover:scale-105" data-tooltip="Task Manager">
                    <i class="fa-solid fa-list-check text-sm"></i>
                </button>
            </div>
        </header>

    <!-- Main Dynamic Content Container -->
        <main class="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-8 relative bg-dark">
            <!-- Top Progress Bar (handled by JS) -->

            <!-- Loader -->
            <div id="loader" class="absolute inset-0 z-20 flex items-center justify-center bg-dark/60 backdrop-blur-sm hidden">
                <div class="flex flex-col items-center gap-3">
                    <div class="w-10 h-10 rounded-full border-[3px] border-slate-800 border-t-white loader"></div>
                    <span class="text-xs text-slate-500 font-medium">Loading...</span>
                </div>
            </div>
            
            <!-- App Root -->
            <div id="app-root" class="max-w-7xl mx-auto min-h-full" style="opacity:0;transform:translateY(8px);transition:opacity 0.25s ease,transform 0.25s ease;">
                <!-- Content injected by app.js -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/dsa_problems.js"></script>
    <script src="js/aptitude_problems.js"></script>
    <script src="js/languages_data.js"></script>
    <script src="js/core_cs_data.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Load User Info
        document.addEventListener('DOMContentLoaded', () => {
            const users = Storage.get('pp_users', []);
            const currentUser = users[0] || { name: 'Student' }; // Fallback for now
            const userNameEl = document.getElementById('user-name');
            if (userNameEl) userNameEl.textContent = currentUser.name;
        });
    </script>
</body>
</html>
